
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독서 성향 테스트</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:"Noto Sans KR",Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}
.container{max-width:720px;margin:auto}
.panel{
  background:white;
  border:1px solid #e1e5ec;
  border-radius:16px;
  padding:24px;
  margin:14px 0;
}
.title{font-size:25px;font-weight:800;line-height:1.4;margin:10px 0}
.muted{color:#6b7280;font-size:14px;line-height:1.7}
.qnum{font-size:13px;color:#777;font-weight:700}
button{
  font-family:inherit;
  cursor:pointer;
}
.btn{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  background:#426fca;
  color:white;
  font-size:15px;
  font-weight:700;
}
.btn.secondary{
  background:white;
  color:#333;
  border:1px solid #d8dce5;
}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:110px}
.progress{
  height:7px;
  background:#e7eaf0;
  border-radius:99px;
  overflow:hidden;
  margin:15px 0;
}
.progress span{
  display:block;
  height:100%;
  background:#426fca;
  transition:width .2s;
}
.question{
  font-size:20px;
  font-weight:700;
  line-height:1.5;
  margin:20px 0;
}
.answer{
  display:block;
  width:100%;
  text-align:left;
  padding:16px;
  border:1px solid #dfe3eb;
  border-radius:12px;
  background:white;
  color:#222;
  font-size:15px;
  line-height:1.6;
  margin:10px 0;
}
.answer:hover{border-color:#426fca}
.answer.selected{
  border:2px solid #426fca;
  background:#edf3ff;
}
.section-title{
  font-size:18px;
  font-weight:800;
  margin:24px 0 10px;
}
.desc{font-size:14px;line-height:1.85;white-space:pre-line}
.score{font-size:30px;font-weight:800;color:#426fca}
.barrow{
  display:grid;
  grid-template-columns:70px 1fr 42px;
  gap:8px;
  align-items:center;
  margin:10px 0;
  font-size:13px;
}
.bar{
  height:8px;
  border-radius:99px;
  background:#e7eaf0;
  overflow:hidden;
}
.bar span{display:block;height:100%;background:#426fca}
.small{font-size:12px;color:#777}
.book{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid #e1e5ec;
  border-radius:12px;
  padding:14px;
  margin:9px 0;
  text-decoration:none;
  color:#222;
}
.book:hover{
  border-color:#426fca;
  background:#edf3ff;
}
.booknum{
  width:28px;
  height:28px;
  border-radius:8px;
  background:#e9edf4;
  display:grid;
  place-items:center;
  font-size:13px;
  flex-shrink:0;
}
.booktitle{font-weight:700;font-size:15px;line-height:1.5}
.bookauthor{font-size:13px;color:#777;margin-top:3px}
[hidden]{display:none!important}
@media(max-width:480px){
  body{padding:12px}
  .panel{padding:18px}
  .title{font-size:22px}
  .question{font-size:18px}
}
</style>
</head>
<body>

<div class="container" id="app">

  <div class="panel" id="start">
    <div class="qnum">READING PERSONALITY TEST</div>
    <div class="title">나의 독서 성향은?</div>
    <p class="muted">
      12개의 질문에 답하면 16가지 독서 유형 중
      가장 가까운 유형을 확인할 수 있습니다.
      독서 방식과 장단점, 추천 도서까지 알아볼 수 있습니다.
    </p>
    <p class="muted">
      각 질문에서 평소 자신에게 더 가까운 답을 선택해 주세요.
    </p>
    <button class="btn" id="begin">테스트 시작하기</button>
  </div>

  <div class="panel" id="quiz" hidden>
    <div class="qnum" id="qnum"></div>
    <div class="progress"><span id="progress"></span></div>
    <div class="question" id="question"></div>
    <div id="answers"></div>
    <div class="row" style="margin-top:18px">
      <button class="btn secondary" id="back">이전</button>
      <button class="btn" id="next" disabled>다음 질문</button>
    </div>
  </div>

  <div id="result" hidden>
    <div class="panel">
      <div class="qnum">YOUR READING TYPE</div>
      <div class="title" id="type"></div>
      <p class="muted" id="tagline"></p>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px">
        <div>
          <div class="muted">최종 유형 일치도</div>
          <div class="score" id="match"></div>
        </div>
        <div class="small" style="text-align:right">
          응답한 답변 중<br>
          최종 유형의 성향과 일치한 비율
        </div>
      </div>

      <div class="progress">
        <span id="matchbar"></span>
      </div>

      <div class="section-title">성향별 비율</div>
      <div id="axis"></div>
    </div>

    <div class="panel">
      <div class="section-title" style="margin-top:0">유형 설명</div>
      <div class="desc" id="description"></div>

      <div class="section-title">장점</div>
      <div class="desc" id="strength"></div>

      <div class="section-title">주의할 점</div>
      <div class="desc" id="caution"></div>

      <div class="section-title">추천 독서법</div>
      <div class="desc" id="method"></div>
    </div>

    <div class="panel">
      <div class="section-title" style="margin-top:0">추천 도서 3권</div>
      <p class="muted">
        책 제목을 누르면 교보문고에서 해당 도서를 검색할 수 있습니다.
      </p>
      <div id="books"></div>
    </div>

    <button class="btn secondary" id="restart" style="width:100%">
      다시 테스트하기
    </button>
  </div>

</div>

const axes=[
{title:"M / L",a:"지식형",b:"감성형",idx:[0,1,2]},
{title:"A / O",a:"분석형",b:"몰입형",idx:[3,4,5]},
{title:"E / U",a:"탐구형",b:"취향형",idx:[6,7,8]},
{title:"R / S",a:"목적형",b:"유희형",idx:[9,10,11]}
];

let answers=Array(12).fill(null);
let position=0;

function renderQuestion(){
  const q=questions[position];

  $("qnum").textContent=`QUESTION ${position+1} / 12`;
  $("progress").style.width=((position+1)/12*100)+"%";
  $("question").textContent=q[0];
  $("answers").innerHTML="";

  [q[1],q[2]].forEach((text,index)=>{
    const button=document.createElement("button");
    button.className="answer"+(answers[position]===index?" selected":"");
    button.textContent=(index===0?"A. ":"B. ")+text;

    button.onclick=()=>{
      answers[position]=index;
      renderQuestion();
    };

    $("answers").appendChild(button);
  });

  $("back").disabled=position===0;
  $("next").disabled=answers[position]===null;
  $("next").textContent=position===11?"결과 확인하기":"다음 질문";
}

function renderResult(){
  let code="";
  let matched=0;
  let axisHTML="";

  axes.forEach((axis,index)=>{
    const countA=axis.idx.filter(i=>answers[i]===0).length;
    const countB=3-countA;
    const chosen=countA>=2?0:1;

    code+=chosen===0
      ?["M","A","E","R"][index]
      :["L","O","U","S"][index];

    matched+=chosen===0?countA:countB;

    const percentA=Math.round(countA/3*100);
    const percentB=100-percentA;

    axisHTML+=`
      <div class="barrow">
        <span>${axis.a}</span>
        <div class="bar"><span style="width:${percentA}%"></span></div>
        <span>${percentA}%</span>
      </div>
      <div class="barrow">
        <span>${axis.b}</span>
        <div class="bar"><span style="width:${percentB}%"></span></div>
        <span>${percentB}%</span>
      </div>
    `;
  });

  const type=types[code];
  const match=Math.round(matched/12*100);

  $("type").textContent=code+" · "+type.name;
  $("tagline").textContent=type.tag;
  $("match").textContent=match+"%";
  $("matchbar").style.width=match+"%";
  $("axis").innerHTML=axisHTML;

  $("description").textContent=type.description;
  $("strength").textContent=type.strength;
  $("caution").textContent=type.caution;
  $("method").textContent=type.method;

  $("books").innerHTML="";

  type.books.forEach((book,index)=>{
    const link=document.createElement("a");
    link.className="book";
    link.target="_blank";
    link.rel="noopener noreferrer";

    link.href=
      "https://search.kyobobook.co.kr/search?keyword="
      +encodeURIComponent(book[0]);

    const number=document.createElement("span");
    number.className="booknum";
    number.textContent=index+1;

    const info=document.createElement("span");

    const title=document.createElement("div");
    title.className="booktitle";
    title.textContent=book[0];

    const author=document.createElement("div");
    author.className="bookauthor";
    author.textContent=book[1];

    info.appendChild(title);
    info.appendChild(author);
    link.appendChild(number);
    link.appendChild(info);
    $("books").appendChild(link);
  });

  $("start").hidden=true;
  $("quiz").hidden=true;
  $("result").hidden=false;
}

$("begin").onclick=()=>{
  position=0;
  $("start").hidden=true;
  $("quiz").hidden=false;
  renderQuestion();
};

$("back").onclick=()=>{
  if(position>0){
    position--;
    renderQuestion();
  }
};

$("next").onclick=()=>{
  if(answers[position]===null)return;

  if(position<11){
    position++;
    renderQuestion();
  }else{
    renderResult();
  }
};

$("restart").onclick=()=>{
  answers=Array(12).fill(null);
  position=0;
  $("result").hidden=true;
  $("start").hidden=false;
};
</script>
